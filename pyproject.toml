[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-first-python-project"
version = "0.1.0"
description = "A simple starter Python project"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Your Name" }
]

[project.scripts]
my-first-python-project = "my_first_python_project.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
